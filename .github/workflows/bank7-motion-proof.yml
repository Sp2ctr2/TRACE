name: Bank7 Motion Proof
on:
  push:
    branches: [design/saeon-bank-7-20260927]
    paths: [.github/workflows/bank7-motion-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83adb8b9bc335033b3b914ca11ca9fecbad56687
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: bank7-build
          path: delivery
          run-id: 36259126891
          github-token: ${{ github.token }}
      - name: Boot regular device with unchanged application binaries
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/tools/boot-emulator.sh')
          s=p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=780\nhw.lcd.height=1688\nhw.lcd.density=320\nskin.name=780x1688\nshowDeviceFrame=no')
          p.write_text(s)
          PY
          bash android-native/tools/boot-emulator.sh
          mkdir -p evidence
          sha256sum delivery/*.apk > evidence/APK_SHA256.txt
          adb install delivery/debug.apk
          adb install delivery/test.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity
          adb shell am force-stop com.google.android.apps.nexuslauncher
      - name: Record actual UI normal transfer and export
        run: |
          adb logcat -c
          adb shell screenrecord --bit-rate 6000000 --time-limit 100 /sdcard/normal.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.Bank7Test#aRealNormalTransferAndReceipt -e pass motion app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/NORMAL.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/normal.mp4 evidence/
          grep -q 'OK (' evidence/NORMAL.txt
          ! grep -q 'FAILURES\|Process crashed' evidence/NORMAL.txt
      - name: Record actual UI HOLD WARN VERIFY UNKNOWN
        if: always()
        run: |
          adb shell screenrecord --bit-rate 6000000 --time-limit 150 /sdcard/protection.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.Bank7Test#bHiddenQuickDemosAndAllDecisions -e pass motion app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/PROTECTION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/protection.mp4 evidence/
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/motion evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/ERRORS.txt
          grep -q 'OK (' evidence/PROTECTION.txt
          ! grep -q 'FAILURES\|Process crashed' evidence/PROTECTION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bank7-motion-proof, path: evidence/}
