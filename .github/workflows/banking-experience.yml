name: Banking Experience APK
on:
  push:
    branches: [design/banking-experience-20260925]
    paths: [experience/**, .github/workflows/banking-experience.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banking-experience
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Apply native V3 source
        run: |
          mkdir -p delivery
          python3 experience/apply_design.py
          python3 experience/fixes.py
          python3 experience/redesign_v3.py
          python3 experience/v3_validation.py
          if [ -f experience/v3_corrections.py ]; then python3 experience/v3_corrections.py; fi
          chmod +x android-native/tools/*.sh
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          git diff --binary > delivery/APPLIED_DESIGN.patch
          cp experience/*.py delivery/
          cd android-native
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          chmod +x gradlew
          zip -qr ../delivery/TRACE_V3_native_source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Compile and execute unit tests
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/TRACE_V3_debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_V3.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-v3.aar
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/TRACE_V3_test.apk
      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-v3-build
          path: |
            delivery/
            android-native/core/build/test-results/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35
        working-directory: android-native
        run: bash tools/boot-emulator.sh
      - name: Native presentation and gate verification
        working-directory: android-native
        run: |
          mkdir -p verification/v3
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell screenrecord --bit-rate 6000000 --time-limit 180 /sdcard/v3-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.RedesignTest -e pass v3 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee verification/v3/INSTRUMENTATION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/v3-motion.mp4 verification/v3/ || true
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/v3 verification/v3/screens || true
          adb logcat -d -s AndroidRuntime:E > verification/v3/RUNTIME_ERRORS.txt
          grep -q 'OK (' verification/v3/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' verification/v3/INSTRUMENTATION.txt
      - name: Optimized APK cold launch
        working-directory: android-native
        run: |
          adb uninstall app.saeon.trace.demo
          adb install app/build/outputs/apk/release/app-release.apk
          adb logcat -c
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee verification/v3/RELEASE_LAUNCH.txt
          sleep 4
          adb exec-out screencap -p > verification/v3/release_launch.png
          adb logcat -d -s AndroidRuntime:E > verification/v3/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' verification/v3/RELEASE_ERRORS.txt
      - name: Archive native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-v3-device
          path: android-native/verification/
