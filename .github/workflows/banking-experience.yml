name: Banking Experience APK
on:
  push:
    branches: [design/banking-experience-20260925]
    paths: [experience/**, .github/workflows/banking-experience.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banking-experience
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply versioned design overlay
        run: |
          python3 experience/apply_design.py
          chmod +x android-native/gradlew android-native/tools/*.sh
          mkdir -p delivery
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          git diff --binary > delivery/APPLIED_DESIGN.patch
          cp experience/apply_design.py delivery/
          cd android-native
          zip -qr ../delivery/TRACE_Experience_native_source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Compile and test
        working-directory: android-native
        run: |
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/TRACE_Experience_debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Experience.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui.aar
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/TRACE_Experience_test.apk
      - name: Save build artifacts immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-experience-build
          path: |
            delivery/
            android-native/core/build/test-results/
            android-native/app/build/test-results/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35
        working-directory: android-native
        run: bash tools/boot-emulator.sh
      - name: Install and exercise native flows
        working-directory: android-native
        run: |
          mkdir -p verification/experience
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell screenrecord --bit-rate 5000000 --time-limit 120 /sdcard/experience-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.ExperienceTest -e pass experience app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee verification/experience/INSTRUMENTATION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/experience-motion.mp4 verification/experience/ || true
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/experience verification/experience/screens || true
          grep -q 'OK (' verification/experience/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' verification/experience/INSTRUMENTATION.txt
      - name: Archive native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-experience-device
          path: android-native/verification/
