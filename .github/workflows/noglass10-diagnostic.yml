name: No Glass 10 bounded diagnostic
on:
  push:
    branches: [design/trace-noglass10-20260928]
    paths: [.github/workflows/noglass10-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: noglass10-build
          path: delivery
          run-id: 36331806220
          github-token: ${{ github.token }}
      - name: Start isolated device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -q delivery/TRACE_NoGlass10_Android_Source.zip -d source
          bash source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
          adb shell locksettings set-pin 2468
          adb shell settings put system screen_off_timeout 1800000
          adb install delivery/debug.apk
          adb install delivery/test.apk
          sleep 10
          adb logcat -c
      - name: Start app and preserve errors
        run: |
          timeout 30 adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity > evidence/LAUNCH.txt || true
          sleep 4
          timeout 10 adb exec-out screencap -p > evidence/first.png || true
          timeout 10 adb logcat -d -s AndroidRuntime:E > evidence/RUNTIME.txt || true
      - name: Run actual screen test
        run: |
          timeout 150 adb shell am instrument -w -r -e class app.saeon.trace.NoGlass10Test#aAllDestinations -e pass diag10 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner > evidence/TEST.txt 2>&1 || true
          timeout 15 adb logcat -d -s AndroidRuntime:E > evidence/RUNTIME_AFTER.txt || true
          timeout 45 adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/diag10 evidence/screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: noglass10-diagnosis, path: evidence/}
