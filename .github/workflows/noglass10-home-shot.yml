name: No Glass 10 single home screenshot
on:
  push:
    branches: [design/trace-noglass10-20260928]
    paths: [.github/workflows/noglass10-home-shot.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: noglass10-build
          path: delivery
          run-id: 36333268963
          github-token: ${{ github.token }}
      - name: Boot clean phone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -q delivery/TRACE_NoGlass10_Android_Source.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=2048\nhw.lcd.width=780\nhw.lcd.height=1688\nhw.lcd.density=320\nskin.name=780x1688\nshowDeviceFrame=no'))
          PY
          bash source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/isolation.txt
          adb shell settings put system screen_off_timeout 1800000
          adb install delivery/TRACE_NoGlass10.apk
          sleep 6
      - name: Launch and record home
        run: |
          adb shell am force-stop app.saeon.trace.demo
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/launch.txt
          sleep 2
          adb shell screenrecord --bit-rate 5000000 --time-limit 4 /sdcard/home.mp4
          adb pull /sdcard/home.mp4 evidence/home.mp4
          test -s evidence/home.mp4
          sha256sum delivery/TRACE_NoGlass10.apk > evidence/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: noglass10-home-shot, path: evidence/}
