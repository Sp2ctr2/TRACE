name: Refined 9 launch evidence
on:
  push:
    branches: [design/trace-refined-glass-20260927]
    paths: [.github/workflows/refined9-launch-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: refined9-build
          path: delivery
          run-id: 36320861259
          github-token: ${{ github.token }}
      - name: Start settled emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -q delivery/TRACE_Refined9_Android_Source.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=780\nhw.lcd.height=1688\nhw.lcd.density=320\nskin.name=780x1688\nshowDeviceFrame=no'))
          PY
          bash source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR.txt
          adb shell am broadcast -a com.android.systemui.demo -e command exit
          adb shell settings put global sysui_demo_on 0
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb install delivery/TRACE_Refined9.apk
          sleep 15
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/FIRST_LAUNCH.txt
          sleep 15
          adb exec-out screencap -p > evidence/settled_home.png
      - name: Record process-cold restart at natural speed
        run: |
          adb shell am force-stop app.saeon.trace.demo
          adb shell am start -W -a android.settings.SETTINGS
          sleep 3
          adb logcat -c
          adb shell screenrecord --bit-rate 12000000 --time-limit 20 /sdcard/restart.mp4 &
          recorder=$!
          sleep 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RESTART_LAUNCH.txt
          sleep 10
          adb exec-out screencap -p > evidence/restarted_home.png
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/restart.mp4 evidence/
          adb logcat -d -s AndroidRuntime:E > evidence/RUNTIME_ERRORS.txt
          sha256sum delivery/TRACE_Refined9.apk > evidence/APK_SHA256.txt
          cp delivery/BUILD_COMMIT.txt evidence/
          ! grep -q 'FATAL EXCEPTION' evidence/RUNTIME_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: refined9-launch-evidence, path: evidence/}
