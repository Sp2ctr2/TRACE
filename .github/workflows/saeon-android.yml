name: SAEON native Android
on:
  push:
    branches: [android/saeon-reference-20260920]
    paths: ['android-native/**', '.github/workflows/saeon-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeon-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect the deployed TRACE product
        run: |
          mkdir -p audit
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            await page.goto('https://sp2ctr2.github.io/TRACE/',{waitUntil:'networkidle'});
            await page.screenshot({path:'audit/trace-live-home.png'});
            const tokens=await page.evaluate(()=>{const c=getComputedStyle(document.documentElement);return Object.fromEntries(['--paper','--paper-light','--ink','--muted','--line','--coral','--coral-deep','--coral-light','--ko'].map(k=>[k,c.getPropertyValue(k)]));});
            fs.writeFileSync('audit/live-tokens.json',JSON.stringify(tokens,null,2));
            fs.writeFileSync('audit/trace-mark.svg.txt',await page.locator('#trace-mark').evaluate(e=>e.outerHTML));
            await page.goto('https://sp2ctr2.github.io/TRACE/#experience',{waitUntil:'networkidle'});
            await page.waitForTimeout(800);
            await page.screenshot({path:'audit/trace-live-experience.png'});
            fs.writeFileSync('audit/reference.html',await page.content());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-reference-audit
          path: audit/
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Preserve source before validation
        run: |
          cd android-native
          mkdir -p delivery
          zip -qr delivery/saeon-trace-android-source.zip . -x '*/build/*' '.gradle/*' 'delivery/*' 'local.properties' '*.jks' '*.keystore'
      - name: Build, test and package the native project
        run: |
          set -o pipefail
          cd android-native
          gradle --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug 2>&1 | tee delivery/build.log
          gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          cp app/build/outputs/apk/debug/*.apk delivery/saeon-trace-demo.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk delivery/saeon-trace-test.apk
          cp app/build/outputs/apk/release/*.apk delivery/
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          rm delivery/saeon-trace-android-source.zip
          zip -qr delivery/saeon-trace-android-source.zip . -x '*/build/*' '.gradle/*' 'delivery/*' 'local.properties' '*.jks' '*.keystore'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-build
          path: |
            android-native/delivery/
            android-native/core/build/reports/
            android-native/core/build/test-results/
            android-native/app/build/reports/
            android-native/app/build/outputs/apk/
          if-no-files-found: error
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: saeon-build
          path: artifact-input
      - name: Use the exact APKs produced by the build job
        run: |
          mkdir -p android-native/app/build/outputs/apk/debug android-native/app/build/outputs/apk/androidTest/debug
          cp artifact-input/delivery/saeon-trace-demo.apk android-native/app/build/outputs/apk/debug/app-debug.apk
          cp artifact-input/delivery/saeon-trace-test.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: saeon-api35-google-apis-x86-64-v1
      - name: Prepare and boot the Android 15 emulator
        timeout-minutes: 15
        run: bash android-native/tools/boot-emulator.sh
      - name: Run native safety, UI, persistence and screenshot regression
        run: bash android-native/tools/run-device-suite.sh
      - name: Stop the emulator
        if: always()
        run: adb emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-device-verification
          path: android-native/verification/
          if-no-files-found: warn
