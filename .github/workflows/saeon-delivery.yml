name: SAEON delivery verification
on:
  push:
    branches: [android/saeon-delivery-20260920]
    paths: ['android-native/**', '.github/workflows/saeon-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeon-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Compile, test, lint and sign demo APKs
        working-directory: android-native
        run: |
          set -o pipefail
          mkdir -p delivery
          gradle --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug 2>&1 | tee delivery/build.log
          gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          cp app/build/outputs/apk/debug/app-debug.apk delivery/saeon-trace-demo.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk delivery/saeon-trace-test.apk
          cp app/build/outputs/apk/release/app-release.apk delivery/saeon-trace-release-demo.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          zip -qr delivery/saeon-trace-android-source.zip . -x '*/build/*' '.gradle/*' 'delivery/*' 'local.properties' '*.jks' '*.keystore' '*.ttf' '*.otf' '*.woff*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-delivery-build
          path: |
            android-native/delivery/
            android-native/core/build/test-results/
            android-native/core/build/reports/
            android-native/app/build/reports/
          if-no-files-found: error
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: saeon-delivery-build
          path: artifact-input
      - name: Use byte-identical build artifacts
        run: |
          mkdir -p android-native/app/build/outputs/apk/debug android-native/app/build/outputs/apk/androidTest/debug
          cp artifact-input/delivery/saeon-trace-demo.apk android-native/app/build/outputs/apk/debug/app-debug.apk
          cp artifact-input/delivery/saeon-trace-test.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: saeon-api35-google-apis-x86-64-v1
      - name: Boot Android 15
        timeout-minutes: 15
        run: bash android-native/tools/boot-emulator.sh
      - name: Run two full passes and size/font/orientation matrix
        run: bash android-native/tools/run-device-suite.sh
      - name: Stop emulator
        if: always()
        run: "$ANDROID_HOME/platform-tools/adb emu kill || true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-delivery-device
          path: android-native/verification/
          if-no-files-found: warn
