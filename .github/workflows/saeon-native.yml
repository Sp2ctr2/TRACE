name: Saeon Native Android
on:
  push:
    branches: [feat/saeon-native-android]
    paths: ['android/**', '.github/workflows/saeon-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeon-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Standard Gradle wrapper
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.11.1
      - name: Build and unit tests
        working-directory: android
        run: |
          mkdir -p evidence
          set -o pipefail
          gradle --no-daemon :domain:test :app:assembleDemoDebug :app:assembleDemoDebugAndroidTest :app:lintDemoDebug 2>&1 | tee evidence/build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 instrumentation — regression twice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            cd android
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb shell svc wifi disable
            adb shell svc data disable
            mkdir -p evidence/pass-1 evidence/pass-2
            gradle --no-daemon :app:connectedDemoDebugAndroidTest
            cp -r app/build/reports/androidTests evidence/pass-1/
            adb pull /sdcard/Android/data/dev.sp2ctr2.saeon.demo/files/screenshots evidence/pass-1/
            gradle --no-daemon :app:connectedDemoDebugAndroidTest --rerun-tasks
            cp -r app/build/reports/androidTests evidence/pass-2/
            adb pull /sdcard/Android/data/dev.sp2ctr2.saeon.demo/files/screenshots evidence/pass-2/
      - name: Package artifacts
        if: always()
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/demo/debug/*.apk delivery/ 2>/dev/null || true
          cp -r android/evidence delivery/ 2>/dev/null || true
          cp -r android/domain/build/test-results delivery/domain-tests 2>/dev/null || true
          cp -r android/app/build/reports delivery/app-reports 2>/dev/null || true
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true
          cd ..
          zip -qr delivery/SAEON_ANDROID_SOURCE.zip android -x '*/build/*' '*/.gradle/*' '*/evidence/*' '*/local.properties'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-native-${{ github.run_number }}
          path: delivery/
          retention-days: 14
