name: SAEON quality and APK delivery
on:
  push:
    branches: [android/saeon-quality-r26b]
    paths: ['android-native/**', '.github/workflows/saeon-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeon-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Build APKs, JVM tests and lint
        run: |
          set -o pipefail
          cd android-native
          mkdir -p delivery
          git rev-parse HEAD > delivery/COMMIT.txt
          gradle --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug 2>&1 | tee delivery/build.log
          gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          cp app/build/outputs/apk/debug/*.apk delivery/saeon-trace-demo.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk delivery/saeon-trace-test.apk
          cp app/build/outputs/apk/release/*.apk delivery/saeon-trace-release-demo.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          zip -qr delivery/saeon-trace-android-source.zip . -x '*/build/*' '.gradle/*' '.kotlin/*' 'delivery/*' 'verification/*' 'local.properties' '*.jks' '*.keystore'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-quality-build
          path: |
            android-native/delivery/
            android-native/core/build/test-results/
            android-native/app/build/reports/
          if-no-files-found: error
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: saeon-api35-google-apis-x86-64-v1
      - name: Boot API 35 emulator
        timeout-minutes: 15
        run: bash android-native/tools/boot-emulator.sh
      - name: Real device regression and screenshots
        run: bash android-native/tools/run-device-suite.sh
      - name: Stop emulator
        if: always()
        run: '${ANDROID_HOME}/platform-tools/adb emu kill || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saeon-quality-device
          path: android-native/verification/
          if-no-files-found: warn
