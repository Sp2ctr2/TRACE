name: TRACE Compact Physical Proof
on:
  push:
    branches: [design/trace-refined-20260925]
    paths: [.github/workflows/trace-compact-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Exact same application source
        run: |
          python3 experience/apply_design.py
          python3 experience/fixes.py
          python3 experience/redesign_v3.py
          python3 experience/v3_validation.py
          python3 experience/v3_corrections.py
          python3 refinement/refine.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/tools/boot-emulator.sh')
          s=p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=640\nhw.lcd.height=1136\nhw.lcd.density=320\nskin.name=640x1136\nshowDeviceFrame=no')
          p.write_text(s)
          PY
          cd android-native
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: KVM and physical compact emulator
        working-directory: android-native
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash tools/boot-emulator.sh
          mkdir -p verification/compact
          adb shell wm size | tee verification/compact/PHYSICAL_DISPLAY.txt
          adb shell wm density | tee -a verification/compact/PHYSICAL_DISPLAY.txt
          grep -q 'Physical size: 640x1136' verification/compact/PHYSICAL_DISPLAY.txt
          grep -q 'Physical density: 320' verification/compact/PHYSICAL_DISPLAY.txt
      - name: Compact flow and capture
        working-directory: android-native
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r -e class app.saeon.trace.RedesignTest#compactAndLargeLayoutsRemainNavigable -e pass compact app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee verification/compact/INSTRUMENTATION.txt
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/compact verification/compact/screens
          adb exec-out screencap -p > verification/compact/display_frame.png
          grep -q 'OK (' verification/compact/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' verification/compact/INSTRUMENTATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-physical-compact
          path: android-native/verification/
