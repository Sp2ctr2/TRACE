name: TRACE Final Demo
on:
  push:
    branches: [design/trace-final-demo-20260926]
    paths: [final/**, .github/workflows/trace-final-demo.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-final-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1', cache-read-only: false}
      - name: Prepare exact final source
        run: |
          mkdir -p delivery
          python3 experience/apply_design.py
          python3 experience/fixes.py
          python3 experience/redesign_v3.py
          python3 experience/v3_validation.py
          python3 experience/v3_corrections.py
          python3 refinement/refine.py
          python3 viewport/apply.py
          python3 viewport/corrections.py
          python3 stage/apply.py
          python3 stage/presentation_layout.py
          python3 stage/window_receipt_polish.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/app/src/main/kotlin/app/saeon/trace/ui/screens/TransferScreens.kt')
          s=p.read_text()
          old='ViewportWarn(record, interaction, model, back, home)'
          if old in s:
              s=s.replace(old,'MotionWarn(state, record, interaction, model, open, back, home)')
          p.write_text(s)
          PY
          python3 final/finalize.py
          cp -r final delivery/final-overlay
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cd android-native
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          chmod +x gradlew
          zip -qr ../delivery/TRACE_Final_source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'

      - name: Build native artifacts and tests
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Final.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/test.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-final.aar
          sha256sum ../delivery/TRACE_Final.apk ../delivery/trace-ui-final.aar > ../delivery/SHA256.txt
          cp -r core/build/test-results ../delivery/core-tests
          cp -r app/build/test-results ../delivery/app-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-build
          path: delivery/

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {name: regular, width: 780, height: 1688}
          - {name: compact, width: 640, height: 1136}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: final-build, path: delivery}

      - name: Configure physical display
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/tools/boot-emulator.sh')
          s=p.read_text().replace(
              'hw.ramSize=4096',
              'hw.ramSize=4096\nhw.lcd.width=${{ matrix.screen.width }}\nhw.lcd.height=${{ matrix.screen.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.screen.width }}x${{ matrix.screen.height }}\nshowDeviceFrame=no'
          )
          p.write_text(s)
          PY
          bash android-native/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size | tee evidence/display.txt
          adb shell wm density | tee -a evidence/display.txt

      - name: Install and capture complete UI inventory
        run: |
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell screenrecord --bit-rate 7000000 --time-limit 180 /sdcard/final-demo.mp4 &
          recorder=$!
          adb shell am instrument -w -r             -e class app.saeon.trace.AllScreensTest,app.saeon.trace.StageTest,app.saeon.trace.ViewportTest             -e pass final             app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/final-demo.mp4 evidence/ || true
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/final evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt

      - name: Verify release APK cold launch
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Final.apk
          adb logcat -c
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          sleep 3
          adb exec-out screencap -p > evidence/release_home.png
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-device-${{ matrix.screen.name }}
          path: evidence/
