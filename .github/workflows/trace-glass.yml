name: TRACE A4 Glass
on:
  push:
    branches: [design/trace-glass-a4-20260927]
    paths: [glass/**, .github/workflows/trace-glass.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trace-a4-glass
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1', cache-read-only: false}
      - uses: actions/download-artifact@v4
        with:
          name: studio-build
          path: baseline-artifact
          run-id: 36297529728
          github-token: ${{ github.token }}
      - name: Materialize exact source and apply A4 design
        run: |
          rm -rf android-native
          mkdir -p android-native delivery
          unzip -q baseline-artifact/TRACE_Studio_native_source.zip -d android-native
          python3 glass/apply.py
          if test -f glass/fix.py; then python3 glass/fix.py; fi
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cp -r glass delivery/overlay
          cd android-native
          chmod +x gradlew
          zip -qr ../delivery/TRACE_Glass_Android_Source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Build and test
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Glass.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/test.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-glass.aar
          cp -r core/build/test-results ../delivery/core-tests
          cp -r app/build/test-results ../delivery/app-tests
          sha256sum ../delivery/TRACE_Glass.apk ../delivery/debug.apk ../delivery/test.apk > ../delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: glass-build, path: delivery/}
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: light, width: 780, height: 1688, theme: light}
          - {name: dark, width: 780, height: 1688, theme: dark}
          - {name: compact, width: 640, height: 1136, theme: light}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: glass-build, path: delivery}
      - name: Start isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -oq delivery/TRACE_Glass_Android_Source.zip -d emulator-source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('emulator-source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=${{ matrix.config.width }}\nhw.lcd.height=${{ matrix.config.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.config.width }}x${{ matrix.config.height }}\nshowDeviceFrame=no'))
          PY
          bash emulator-source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size > evidence/display.txt
          adb shell wm density >> evidence/display.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR_ISOLATION.txt
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          sleep 12
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity
          sleep 5
          cp delivery/SHA256.txt evidence/
          cp delivery/BUILD_COMMIT.txt evidence/
      - name: Verify actual banking flows and all key screen captures
        run: |
          adb shell am instrument -w -r -e class app.saeon.trace.StudioTest,app.saeon.trace.GlassTest -e theme ${{ matrix.config.theme }} -e pass glass app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt
      - name: Record real transfer animation
        if: always()
        run: |
          adb shell screenrecord --bit-rate 6500000 --time-limit 90 /sdcard/glass-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.StudioTest#fLiveTransferAndPersistence -e theme ${{ matrix.config.theme }} -e pass glass app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/MOTION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/glass-motion.mp4 evidence/ || true
      - name: Preserve all measurements
        if: always()
        run: |
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/glass evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
          adb shell dumpsys gfxinfo app.saeon.trace.demo > evidence/GFXINFO.txt
      - name: Release startup
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Glass.apk
          adb logcat -c
          adb shell screenrecord --bit-rate 6000000 --time-limit 12 /sdcard/glass-launch.mp4 &
          recorder=$!
          sleep 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          sleep 4
          adb exec-out screencap -p > evidence/release_home.png
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/glass-launch.mp4 evidence/ || true
          adb logcat -d -s AndroidRuntime:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-device-${{ matrix.config.name }}
          path: evidence/
