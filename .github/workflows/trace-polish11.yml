name: TRACE 11 delivery
on:
  push:
    branches: [design/trace-polish11-20260928]
    paths: [polish11/**, .github/workflows/trace-polish11.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: trace-polish11, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1', cache-read-only: false}
      - uses: actions/download-artifact@v4
        with:
          name: noglass10-build
          path: baseline
          run-id: 36333268963
          github-token: ${{ github.token }}
      - name: Prepare exact approved source
        run: |
          rm -rf android-native
          mkdir -p android-native delivery
          unzip -q baseline/TRACE_NoGlass10_Android_Source.zip -d android-native
          python3 polish11/apply.py
          cp polish11/ReleaseSmoke11Test.kt android-native/app/src/androidTest/kotlin/app/saeon/trace/
          if test -f polish11/fix.py; then python3 polish11/fix.py; fi
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cd android-native
          chmod +x gradlew
          zip -qr ../delivery/TRACE_11_Android_Source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/legacy-tests/*'
      - name: Build matching app and tests
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee ../delivery/DEBUG_BUILD.log
          ./gradlew :core:cleanTest :core:test :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_11.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/test.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-11.aar
          cp -r core/build/test-results ../delivery/core-tests
          cp -r app/build/test-results ../delivery/app-tests
          sha256sum ../delivery/TRACE_11.apk ../delivery/debug.apk ../delivery/test.apk > ../delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: trace11-build, path: delivery/}
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: phone-light, width: 780, height: 1688, theme: light}
          - {name: phone-dark, width: 780, height: 1688, theme: dark}
          - {name: compact, width: 640, height: 1136, theme: light}
          - {name: tablet-portrait, width: 1600, height: 2560, theme: light}
          - {name: tablet-landscape, width: 2560, height: 1600, theme: light}
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: trace11-build, path: delivery}
      - name: Start clean emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -q delivery/TRACE_11_Android_Source.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=2048\nhw.lcd.width=${{ matrix.config.width }}\nhw.lcd.height=${{ matrix.config.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.config.width }}x${{ matrix.config.height }}\nshowDeviceFrame=no'))
          PY
          bash source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR.txt
          adb shell settings put system screen_off_timeout 1800000
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell wm size > evidence/display.txt
          adb shell wm density >> evidence/display.txt
          adb install delivery/debug.apk
          adb install delivery/test.apk
          cp delivery/SHA256.txt evidence/
          cp delivery/BUILD_COMMIT.txt evidence/
          sleep 8
      - name: Screens and state in isolated test sessions
        run: |
          failed=0
          for test in bankScreens detailScreens policies navigationAndResize servicesAndDemo; do
            timeout 170 adb shell am instrument -w -r -e class app.saeon.trace.Acceptance11Test#$test -e theme ${{ matrix.config.theme }} -e pass trace11 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner > evidence/$test.txt 2>&1 || failed=1
            grep -q 'OK (' evidence/$test.txt || failed=1
            if grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/$test.txt; then failed=1; fi
            timeout 50 adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/trace11 evidence/screens >/dev/null 2>&1 || true
          done
          echo $failed > evidence/FAILURE_COUNT.txt
          exit $failed
      - name: Record genuine interactions
        if: always()
        run: |
          adb shell screenrecord --bit-rate 6500000 --time-limit 50 /sdcard/trace11-motion.mp4 &
          recorder=$!
          timeout 65 adb shell am instrument -w -r -e class app.saeon.trace.Acceptance11Test#motion -e theme ${{ matrix.config.theme }} -e pass trace11 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner > evidence/MOTION.txt 2>&1 || true
          timeout 5 adb shell pkill -INT screenrecord || true
          wait $recorder || true
          timeout 20 adb pull /sdcard/trace11-motion.mp4 evidence/ || true
      - name: Optimized APK smoke test
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_11.apk
          adb install -r delivery/test.apk
          adb shell screenrecord --bit-rate 7000000 --time-limit 20 /sdcard/trace11-launch.mp4 &
          recorder=$!
          timeout 70 adb shell am instrument -w -r -e class app.saeon.trace.ReleaseSmoke11Test app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner > evidence/RELEASE_SMOKE.txt 2>&1 || true
          timeout 5 adb shell pkill -INT screenrecord || true
          wait $recorder || true
          timeout 20 adb pull /sdcard/trace11-launch.mp4 evidence/ || true
          timeout 25 adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/release11 evidence/release || true
          grep -q 'OK (' evidence/RELEASE_SMOKE.txt
      - name: Collect original evidence
        if: always()
        run: |
          timeout 10 adb logcat -d -s AndroidRuntime:E > evidence/RUNTIME.txt || true
          cp -r source/verification/logs evidence/emulator-logs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace11-device-${{ matrix.config.name }}
          path: evidence/
