name: TRACE Refined
on:
  push:
    branches: [design/trace-refined-20260925]
    paths: [refinement/**, .github/workflows/trace-refined.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-refined
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Assemble source snapshot
        run: |
          mkdir -p delivery
          python3 experience/apply_design.py
          python3 experience/fixes.py
          python3 experience/redesign_v3.py
          python3 experience/v3_validation.py
          python3 experience/v3_corrections.py
          python3 refinement/refine.py
          if [ -f refinement/fix.py ]; then python3 refinement/fix.py; fi
          chmod +x android-native/tools/*.sh
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cp refinement/*.py delivery/
          cd android-native
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          chmod +x gradlew
          zip -qr ../delivery/TRACE_Refined_source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Build and execute core tests
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Refined.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/TRACE_Refined_debug.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-refined.aar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-build
          path: |
            delivery/
            android-native/core/build/test-results/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot
        working-directory: android-native
        run: bash tools/boot-emulator.sh
      - name: Device flows with animations enabled
        working-directory: android-native
        run: |
          mkdir -p verification/refined
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell screenrecord --bit-rate 6000000 --time-limit 180 /sdcard/refined.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.RedesignTest -e pass refined app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee verification/refined/INSTRUMENTATION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/refined.mp4 verification/refined/ || true
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/refined verification/refined/screens || true
          adb logcat -d -s AndroidRuntime:E > verification/refined/RUNTIME_ERRORS.txt
          grep -q 'OK (' verification/refined/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' verification/refined/INSTRUMENTATION.txt
      - name: Optimized APK installation
        working-directory: android-native
        run: |
          adb uninstall app.saeon.trace.demo
          adb install app/build/outputs/apk/release/app-release.apk
          adb logcat -c
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee verification/refined/RELEASE_LAUNCH.txt
          sleep 4
          adb exec-out screencap -p > verification/refined/release_home.png
          adb logcat -d -s AndroidRuntime:E > verification/refined/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' verification/refined/RELEASE_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-device
          path: android-native/verification/
