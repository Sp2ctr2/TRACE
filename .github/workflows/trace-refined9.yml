name: TRACE Refined 9
on:
  push:
    branches: [design/trace-refined-glass-20260927]
    paths: [refined/**, .github/workflows/trace-refined9.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trace-refined9
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1', cache-read-only: false}
      - uses: actions/download-artifact@v4
        with:
          name: glass-build
          path: baseline
          run-id: 36314811673
          github-token: ${{ github.token }}
      - name: Assemble source
        run: |
          rm -rf android-native
          mkdir -p android-native delivery
          unzip -q baseline/TRACE_Glass_Android_Source.zip -d android-native
          python3 refined/apply.py
          python3 refined/fix.py
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cp -r refined delivery/overlay
          cd android-native
          chmod +x gradlew
          zip -qr ../delivery/TRACE_Refined9_Android_Source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Compile and unit tests
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Refined9.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/test.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-refined9.aar
          cp -r core/build/test-results ../delivery/core-tests
          cp -r app/build/test-results ../delivery/app-tests
          sha256sum ../delivery/TRACE_Refined9.apk ../delivery/debug.apk ../delivery/test.apk > ../delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: refined9-build, path: delivery/}
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: light, width: 780, height: 1688, theme: light}
          - {name: dark, width: 780, height: 1688, theme: dark}
          - {name: compact, width: 640, height: 1136, theme: light}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: refined9-build, path: delivery}
      - name: Start Android device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -oq delivery/TRACE_Refined9_Android_Source.zip -d emulator-source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('emulator-source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=${{ matrix.config.width }}\nhw.lcd.height=${{ matrix.config.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.config.width }}x${{ matrix.config.height }}\nshowDeviceFrame=no'))
          PY
          bash emulator-source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size > evidence/display.txt
          adb shell wm density >> evidence/display.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR_ISOLATION.txt
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell settings put global sysui_demo_allowed 1
          adb shell am broadcast -a com.android.systemui.demo -e command enter
          adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
          adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 85 -e plugged false
          adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e datatype lte
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          sleep 12
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity
          sleep 5
          cp delivery/SHA256.txt evidence/
          cp delivery/BUILD_COMMIT.txt evidence/
      - name: Verify revised screens and transactions
        run: |
          adb shell am instrument -w -r -e class app.saeon.trace.RefinedTest,app.saeon.trace.StudioTest#dBankServicesHaveDurableEffects -e theme ${{ matrix.config.theme }} -e pass refined9 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt
      - name: Record actual interactions
        if: always()
        run: |
          adb shell screenrecord --bit-rate 7500000 --time-limit 90 /sdcard/refined-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.RefinedTest#liveTransferMotion -e theme ${{ matrix.config.theme }} -e pass refined9 app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/MOTION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/refined-motion.mp4 evidence/ || true
      - name: Preserve unedited UI evidence
        if: always()
        run: |
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/refined9 evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
          adb shell dumpsys gfxinfo app.saeon.trace.demo > evidence/GFXINFO.txt
          adb shell dumpsys window > evidence/WINDOW.txt
      - name: Release startup and real launch capture
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Refined9.apk
          adb logcat -c
          adb shell screenrecord --bit-rate 9000000 --time-limit 12 /sdcard/refined-launch.mp4 &
          recorder=$!
          sleep 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          sleep 4
          adb exec-out screencap -p > evidence/release_home.png
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/refined-launch.mp4 evidence/ || true
          adb logcat -d -s AndroidRuntime:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined9-device-${{ matrix.config.name }}
          path: evidence/
