name: TRACE Solid Adaptive
on:
  push:
    branches: [design/trace-solid-adaptive-20260927]
    paths: [solid/**, .github/workflows/trace-solid-adaptive.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trace-solid-adaptive
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1', cache-read-only: false}
      - uses: actions/download-artifact@v4
        with:
          name: refined9-build
          path: baseline
          run-id: 36320861259
          github-token: ${{ github.token }}
      - name: Assemble adaptive source
        run: |
          rm -rf android-native
          mkdir -p android-native delivery
          unzip -q baseline/TRACE_Refined9_Android_Source.zip -d android-native
          python3 solid/apply.py
          git rev-parse HEAD > delivery/BUILD_COMMIT.txt
          cp -r solid delivery/overlay
          cd android-native
          chmod +x gradlew
          zip -qr ../delivery/TRACE_Adaptive_Android_Source.zip . -x '*/build/*' '.gradle/*' 'local.properties' '.android-user/*' 'verification/*'
      - name: Compile and unit test
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew :core:cleanTest :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :trace-ui:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../delivery/BUILD.log
          cp app/build/outputs/apk/release/app-release.apk ../delivery/TRACE_Adaptive.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../delivery/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../delivery/test.apk
          cp trace-ui/build/outputs/aar/trace-ui-release.aar ../delivery/trace-ui-adaptive.aar
          cp -r core/build/test-results ../delivery/core-tests
          cp -r app/build/test-results ../delivery/app-tests
          sha256sum ../delivery/TRACE_Adaptive.apk ../delivery/debug.apk ../delivery/test.apk > ../delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: adaptive-build, path: delivery/}

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: phone-light, width: 780, height: 1688, theme: light, record: true}
          - {name: phone-dark, width: 780, height: 1688, theme: dark, record: false}
          - {name: compact, width: 640, height: 1136, theme: light, record: false}
          - {name: phone-landscape, width: 1688, height: 780, theme: light, record: false}
          - {name: tablet-portrait, width: 1600, height: 2560, theme: light, record: false}
          - {name: tablet-landscape, width: 2560, height: 1600, theme: light, record: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: adaptive-build, path: delivery}

      - name: Start isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          unzip -oq delivery/TRACE_Adaptive_Android_Source.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace(
              'hw.ramSize=4096',
              'hw.ramSize=4096\nhw.lcd.width=${{ matrix.config.width }}\nhw.lcd.height=${{ matrix.config.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.config.width }}x${{ matrix.config.height }}\nshowDeviceFrame=no'
          ))
          PY
          bash source/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size | tee evidence/display.txt
          adb shell wm density | tee -a evidence/display.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR_ISOLATION.txt
          adb shell am broadcast -a com.android.systemui.demo -e command exit || true
          adb shell settings put global sysui_demo_on 0 || true
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          sleep 12
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/START.txt
          sleep 4
          cp delivery/SHA256.txt evidence/
          cp delivery/BUILD_COMMIT.txt evidence/

      - name: Adaptive UI and transaction verification
        run: |
          set -o pipefail
          adb shell am instrument -w -r             -e class app.saeon.trace.AdaptiveTest,app.saeon.trace.RefinedTest,app.saeon.trace.StudioTest#dBankServicesHaveDurableEffects             -e theme ${{ matrix.config.theme }} -e pass adaptive             app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt

      - name: Record representative animation
        if: matrix.config.record == true
        run: |
          adb shell screenrecord --bit-rate 9000000 --time-limit 100 /sdcard/adaptive-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.RefinedTest#liveTransferMotion -e theme ${{ matrix.config.theme }} -e pass adaptive app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/MOTION.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/adaptive-motion.mp4 evidence/ || true

      - name: Collect all evidence
        if: always()
        run: |
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/adaptive evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
          adb shell dumpsys gfxinfo app.saeon.trace.demo > evidence/GFXINFO.txt
          adb shell dumpsys window > evidence/WINDOW.txt

      - name: Verify release cold start
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Adaptive.apk
          adb logcat -c
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          sleep 5
          adb exec-out screencap -p > evidence/release_home.png
          adb logcat -d -s AndroidRuntime:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-device-${{ matrix.config.name }}
          path: evidence/
