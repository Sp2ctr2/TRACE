name: TRACE Studio clean capture
on:
  push:
    branches: [design/trace-studio-20260927]
    paths: [.github/workflows/trace-studio-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {name: regular-light, width: 780, height: 1688, theme: light}
          - {name: regular-dark, width: 780, height: 1688, theme: dark}
          - {name: compact-light, width: 640, height: 1136, theme: light}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: studio-build
          path: delivery
          run-id: 36297529728
          github-token: ${{ github.token }}
      - name: Start isolated emulator and disable unrelated launcher
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=${{ matrix.screen.width }}\nhw.lcd.height=${{ matrix.screen.height }}\nhw.lcd.density=320\nskin.name=${{ matrix.screen.width }}x${{ matrix.screen.height }}\nshowDeviceFrame=no'))
          PY
          bash android-native/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size > evidence/display.txt
          adb shell wm density >> evidence/display.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher | tee evidence/EMULATOR_ISOLATION.txt
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          sha256sum delivery/TRACE_Studio.apk delivery/debug.apk delivery/test.apk > evidence/TESTED_ARTIFACT_HASHES.txt
          cp delivery/BUILD_COMMIT.txt evidence/
      - name: Record real interactive transfer
        run: |
          adb shell screenrecord --bit-rate 6500000 --time-limit 90 /sdcard/studio-motion.mp4 &
          recorder=$!
          adb shell am instrument -w -r -e class app.saeon.trace.StudioTest#fLiveTransferAndPersistence -e theme ${{ matrix.screen.theme }} -e pass clean app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/MOTION_TEST.txt
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/studio-motion.mp4 evidence/
          grep -q 'OK (' evidence/MOTION_TEST.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/MOTION_TEST.txt
      - name: Capture every implemented destination and verify state changes
        run: |
          adb shell am instrument -w -r -e class app.saeon.trace.StudioTest -e theme ${{ matrix.screen.theme }} -e pass clean app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml evidence/window.xml
          adb shell dumpsys gfxinfo app.saeon.trace.demo > evidence/GFXINFO.txt
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt
          ! grep -q 'not responding\|계속 중단\|응답하지' evidence/window.xml
      - name: Preserve all unedited screen captures
        if: always()
        run: |
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/clean evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
      - name: Record release launch
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Studio.apk
          adb logcat -c
          adb shell screenrecord --bit-rate 6000000 --time-limit 12 /sdcard/studio-launch.mp4 &
          recorder=$!
          sleep 1
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          sleep 5
          adb exec-out screencap -p > evidence/release_home.png
          adb shell pkill -INT screenrecord || true
          wait $recorder || true
          adb pull /sdcard/studio-launch.mp4 evidence/
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-clean-${{ matrix.screen.name }}
          path: evidence/
