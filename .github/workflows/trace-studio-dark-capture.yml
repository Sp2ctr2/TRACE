name: TRACE Studio dark UI verification
on:
  push:
    branches: [design/trace-studio-20260927]
    paths: [.github/workflows/trace-studio-dark-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dark-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          name: studio-build
          path: delivery
          run-id: 36297529728
          github-token: ${{ github.token }}
      - name: Isolate and settle emulator before instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/tools/boot-emulator.sh')
          p.write_text(p.read_text().replace('hw.ramSize=4096','hw.ramSize=4096\nhw.lcd.width=780\nhw.lcd.height=1688\nhw.lcd.density=320\nskin.name=780x1688\nshowDeviceFrame=no'))
          PY
          bash android-native/tools/boot-emulator.sh
          mkdir -p evidence
          adb shell wm size > evidence/display.txt
          adb shell wm density >> evidence/display.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > evidence/EMULATOR_ISOLATION.txt
          adb install -r delivery/debug.apk
          adb install -r delivery/test.apk
          sleep 15
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/DEBUG_START.txt
          sleep 8
          adb logcat -c
          sha256sum delivery/TRACE_Studio.apk delivery/debug.apk delivery/test.apk > evidence/TESTED_ARTIFACT_HASHES.txt
          cp delivery/BUILD_COMMIT.txt evidence/
      - name: All dark screens and functional checks without simultaneous encoding
        run: |
          adb shell am instrument -w -r -e class app.saeon.trace.StudioTest -e theme dark -e pass clean-dark app.saeon.trace.demo.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/INSTRUMENTATION.txt
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml evidence/window.xml
          grep -q 'OK (' evidence/INSTRUMENTATION.txt
          ! grep -q 'FAILURES\|INSTRUMENTATION_FAILED\|Process crashed' evidence/INSTRUMENTATION.txt
          ! grep -q 'not responding\|응답하지' evidence/window.xml
      - name: Capture evidence even on failure
        if: always()
        run: |
          adb pull /sdcard/Android/data/app.saeon.trace.demo/files/verification/clean-dark evidence/screens || true
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RUNTIME_ERRORS.txt
      - name: Release cold start
        if: always()
        run: |
          adb uninstall app.saeon.trace.demo || true
          adb install delivery/TRACE_Studio.apk
          adb logcat -c
          adb shell am start -W -n app.saeon.trace.demo/app.saeon.trace.MainActivity | tee evidence/RELEASE_LAUNCH.txt
          sleep 5
          adb exec-out screencap -p > evidence/release_home.png
          adb logcat -d -s AndroidRuntime:E ActivityManager:E > evidence/RELEASE_ERRORS.txt
          ! grep -q 'FATAL EXCEPTION' evidence/RELEASE_ERRORS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: studio-dark-ui-verified, path: evidence/}
