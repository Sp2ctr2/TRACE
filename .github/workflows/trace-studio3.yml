name: Trace Studio 3 native SDK and banking verification
on:
  push:
    branches: [android/trace-studio3-20260920]
    paths: ['trace-studio3/**', '.github/workflows/trace-studio3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-studio3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply bank and Studio integration source
        run: |
          python trace-studio-native/upgrade.py android-native
          python trace-studio-native/stabilize.py android-native
          python trace-studio3/make_design.py
          python trace-studio3/apply.py android-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Compile app, SDK, tests and exact source
        run: |
          set -o pipefail
          cd android-native
          mkdir -p delivery
          gradle --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :trace-design:assembleRelease :app:lintDebug 2>&1 | tee delivery/build.log
          cp app/build/outputs/apk/debug/*.apk delivery/saeon-trace-demo.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk delivery/saeon-trace-test.apk
          cp app/build/outputs/apk/release/*.apk delivery/
          cp trace-design/build/outputs/aar/*release.aar delivery/trace-design-release.aar
          sha256sum delivery/*.apk delivery/*.aar > delivery/SHA256SUMS.txt
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > delivery/provenance.txt
          zip -qr delivery/trace-android-source.zip . -x '*/build/*' '.gradle/*' '.kotlin/*' '.android-user/*' 'verification/*' 'delivery/*' 'local.properties' '*.jks' '*.keystore' '*.otf' '*.ttf'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-studio3-build
          path: |
            android-native/delivery/
            android-native/core/build/test-results/
            android-native/app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Apply identical test sources
        run: |
          python trace-studio-native/upgrade.py android-native
          python trace-studio-native/stabilize.py android-native
          python trace-studio3/make_design.py
          python trace-studio3/apply.py android-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: trace-studio3-build
          path: artifact-input
      - name: Install exact build artifacts
        run: |
          mkdir -p android-native/app/build/outputs/apk/{debug,release,androidTest/debug}
          cp artifact-input/delivery/saeon-trace-demo.apk android-native/app/build/outputs/apk/debug/app-debug.apk
          cp artifact-input/delivery/saeon-trace-test.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp artifact-input/delivery/app-release.apk android-native/app/build/outputs/apk/release/app-release.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: saeon-api35-google-apis-x86-64-v1
      - name: Boot Android 15
        timeout-minutes: 15
        run: bash android-native/tools/boot-emulator.sh
      - name: Run two passes and configuration regressions
        run: bash android-native/tools/run-device-suite.sh
      - name: Stop emulator
        if: always()
        run: adb emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-studio3-device
          path: android-native/verification/
          if-no-files-found: warn
