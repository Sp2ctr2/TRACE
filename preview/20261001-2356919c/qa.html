<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TRACE 공개 프리뷰 · 화면 검증</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#20211f;font-family:system-ui,sans-serif}header{padding:16px 24px;background:#fbfaf7;border-bottom:1px solid #d6d5cf;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0}p{font-size:12px;margin:0;color:#676960}button{background:#fff;border:1px solid #aaa99f;border-radius:6px;padding:8px 12px;cursor:pointer}button:focus-visible{outline:3px solid #d93b25;outline-offset:2px}button[aria-pressed=true]{background:#20211f;color:#fff}main{padding:20px 0;min-width:max-content}iframe{display:block;border:0;margin:0 auto;background:#f5f4f0;width:393px;height:873px;box-shadow:0 3px 20px #0001}output{font:12px ui-monospace,monospace}</style></head><body><header><h1>TRACE 프리뷰 화면 검증</h1><button type="button" data-width="360" data-height="800" aria-pressed="false">360 × 800</button><button type="button" data-width="393" data-height="873" aria-pressed="true">393 × 873</button><button type="button" data-width="412" data-height="915" aria-pressed="false">412 × 915</button><button type="button" data-width="1188" data-height="761" aria-pressed="false">1188 × 761</button><button type="button" data-width="873" data-height="393" aria-pressed="false">873 × 393</button><button type="button" data-width="393" data-height="450" aria-pressed="false">393 × 450</button><output id="size">393 × 873 CSS px</output><p>브라우저 iframe 화면 크기 시험입니다. 실제 휴대폰·터치·IME·화면낭독기 검증이 아닙니다.</p></header><main><iframe id="preview" src="./index.html#experience" title="TRACE 개선 후보 화면"></iframe></main><script>const frame=document.getElementById('preview');document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.getElementById('size').textContent=button.dataset.width+' × '+button.dataset.height+' CSS px';}));</script></body></html>
